<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RASCH MATH PLATFORM">
  <!--
    Platforma belgisi: to'q ko'k maydon ustida oltin «R».
    Panel yon menyusidagi belgi bilan bir xil ohangda.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4c766"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f2b46"/>
  <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#gold)"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="800" fill="#0f2b46">R</text>
</svg>
