{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — Rasch Math</title>
  <style>
    :root {
      --navy: #0f2b46; --navy-600: #1d4e7e; --gold: #c9a227;
      --bg: #f6f8fb; --surface: #fff; --border: #dde5ee;
      --text: #14212e; --muted: #61728a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 34px 30px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(15,43,70,.07), 0 12px 28px rgba(15,43,70,.06);
    }
    .mark {
      width: 52px; height: 52px; margin: 0 auto 14px;
      border-radius: 14px;
      background: linear-gradient(140deg, var(--gold), #e4c766);
      color: var(--navy);
      display: grid; place-items: center;
      font-weight: 800; font-size: 26px;
    }
    h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.3px; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 14.5px; }
    .err {
      margin: 0 0 16px; padding: 10px 14px;
      background: #fdecec; border-left: 4px solid #d9534f;
      border-radius: 8px; font-size: 14px; text-align: left;
    }
    .btn-tg {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 22px;
      background: #2aabee; color: #fff;
      border-radius: 12px; border: none;
      font-size: 16px; font-weight: 650;
      text-decoration: none; cursor: pointer;
      transition: filter .15s ease;
    }
    .btn-tg:hover { filter: brightness(1.07); }
    .btn-tg svg {
      width: 22px; height: 22px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">R</div>
    <h1>Rasch Math</h1>
    <p class="sub">Kompyuterda ishlash uchun Telegram hisobingiz bilan kiring</p>

    {% if error %}<p class="err">{{ error }}</p>{% endif %}

    <a class="btn-tg" href="{{ oauth_link }}">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.5 3.5 2.8 10.8l5.4 1.8 2 6.4 2.9-3.6 4.7 3.5z"/>
        <path d="m8.2 12.6 9.4-6.6-6.4 8.4"/>
      </svg>
      Telegram orqali kirish
    </a>
  </div>
</body>
</html>
